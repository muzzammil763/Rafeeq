name: Update README contributors

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/update_contributors.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit updated contributors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/readme/contributors/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh README contributors'
            git push origin HEAD:main
          fi
