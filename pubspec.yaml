name: rafeeq
description: Your Islamic Companion
publish_to: "none"
version: 1.2.21+50

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.0
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.3.1
  equatable: ^2.0.5
  rx_shared_preferences: ^4.0.0
  path_provider: ^2.0.15
  flutter_cache_manager: ^3.4.1
  flutter_animate: ^4.5.2
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.17
  flutter_islamic_icons: ^1.0.2

  path: ^1.8.3
  sqflite: ^2.3.0
  auto_size_text: ^3.0.0
  firebase_core: 4.12.1
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.0.8
  package_info_plus: ^10.2.0
  url_launcher: ^6.2.3
  share_plus: ^13.2.0
  flutter_spinkit: ^5.2.0
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  intl:
  flutter_qiblah_advanced: ^4.0.1
  flutter_svg: ^2.0.9
  scrollable_positioned_list: ^0.3.8
  adhan: ^2.0.0+1
  geolocator: ^14.0.2

  confetti: ^0.8.0
  flutter_slidable: ^4.0.0
  cached_network_image: ^3.3.1
  hijri: ^3.0.0

  in_app_update: ^4.2.5
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  app_settings: ^7.0.0
  geocoding: ^4.0.0
  shimmer: ^3.0.0

  dio: ^5.4.0
  flutter_staggered_grid_view: ^0.7.0
  toastification: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_riverpod: ^3.3.1
  change_app_package_name: ^1.1.0
  flutter_native_splash: ^2.3.8
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.0

flutter_native_splash:
  color: "#033736"

  android_12:
    color: "#033736"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/home/
    - assets/onboarding/
    - assets/quran/
    - assets/fonts/
    - assets/sounds/
    - shorebird.yaml

  fonts:
    - family: Muhammadi Uthmanic
      fonts:
        - asset: assets/fonts/Muhammadi Uthmanic.ttf
    - family: Al-Qalam
      fonts:
        - asset: assets/fonts/Al-Qalam.ttf
    - family: Alvi
      fonts:
        - asset: assets/fonts/alvi.ttf
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
